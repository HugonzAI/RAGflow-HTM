version: "3.9"

services:
  # =============================================================
  # RAGFlow Application
  # =============================================================
  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.24.0}
    container_name: ragflow-htm
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SVR_WEB_HTTP_PORT:-80}:80"
      - "${SVR_WEB_HTTPS_PORT:-443}:443"
      - "${SVR_HTTP_PORT:-9380}:9380"
    volumes:
      - ragflow_data:/ragflow/data
      - ragflow_logs:/ragflow/logs
    environment:
      - TZ=${TZ:-UTC}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      - MACOS=${MACOS:-}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MINIO_USER=${MINIO_USER:-rag_flow}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DOC_ENGINE=${DOC_ENGINE:-elasticsearch}
      - DOC_BULK_SIZE=${DOC_BULK_SIZE:-4}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
    mem_limit: ${MEM_LIMIT:-8073741824}
    restart: unless-stopped
    networks:
      - ragflow

  # =============================================================
  # Elasticsearch — Document search engine
  # =============================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ragflow-htm-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - bootstrap.memory_lock=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=ragflow-htm
    ports:
      - "${ES_PORT:-1200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 120
    restart: unless-stopped
    networks:
      - ragflow

  # =============================================================
  # MySQL — Metadata store
  # =============================================================
  mysql:
    image: mysql:8.0.39
    container_name: ragflow-htm-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=rag_flow
    ports:
      - "${EXPOSE_MYSQL_PORT:-5455}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --max_allowed_packet=${MYSQL_MAX_PACKET:-1073741824}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 120
    restart: unless-stopped
    networks:
      - ragflow

  # =============================================================
  # MinIO — Object storage for uploaded documents (PDFs, etc.)
  # =============================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: ragflow-htm-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-rag_flow}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 120
    restart: unless-stopped
    networks:
      - ragflow

  # =============================================================
  # Redis (Valkey) — Caching layer
  # =============================================================
  redis:
    image: valkey/valkey:8
    container_name: ragflow-htm-redis
    command: valkey-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 120
    restart: unless-stopped
    networks:
      - ragflow

volumes:
  ragflow_data:
  ragflow_logs:
  es_data:
  mysql_data:
  minio_data:
  redis_data:

networks:
  ragflow:
    driver: bridge
